name: frontend
description: "Cinema Booking App Project"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0 # Thư viện HTTP để gửi yêu cầu API
  flutter_secure_storage: ^10.0.0 # Kho lưu trữ bảo mật
  image_picker: ^1.2.1 # Chọn ảnh
  jwt_decoder: ^2.0.1 # Decode jwt token
  cached_network_image: ^3.3.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  webview_flutter: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
